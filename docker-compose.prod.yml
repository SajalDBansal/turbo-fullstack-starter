volumes:
  postgres_data:
    external: true

services:
  node-api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
    ports:
      - 8080:8080
    networks:
      - app_network
  next-web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST}
    ports:
      - 3000:3000
    networks:
      - app_network
  react-web:
    container_name: web-react
    build:
      context: .
      dockerfile: ./apps/web-react/Dockerfile
    environment:
      - VITE_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST}
    restart: always
    ports:
      - 3001:80
    networks:
      - app_network
  postgres-db:
    platform: linux/amd64
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${DOCKER_POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - 5432:${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  app_network:
    external: true
    driver: bridge
